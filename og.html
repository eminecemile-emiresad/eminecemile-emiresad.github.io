<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:630px;overflow:hidden;font-family:"Jost",sans-serif;position:relative;
 background:radial-gradient(110% 70% at 50% -10%,#FFFDF8 0%,rgba(255,253,248,0) 60%),#FBF7F0;
 display:grid;place-items:center}
.m{position:absolute;display:block;height:auto}
.tl{top:0;left:0;width:300px}.tr{top:0;right:0;width:300px;transform:scaleX(-1)}
.bl{bottom:0;left:0;width:305px}.br{bottom:0;right:0;width:305px;transform:scaleX(-1)}
.c{position:relative;text-align:center;width:640px}
.orn{display:block;width:230px;margin:0 auto 6px}
.nm{display:block;width:560px;margin:0 auto}
h1{font-family:"Alex Brush",cursive;font-weight:400;line-height:1.02;color:#13294B}
.n{display:block;font-size:104px;white-space:nowrap}
.amp{display:block;font-size:56px;color:#B08841;line-height:1}
.date{margin-top:22px;font-size:17px;font-weight:400;letter-spacing:.3em;text-transform:uppercase;color:#13294B}
.inv{margin-top:14px;font-size:20px;letter-spacing:.2em;color:#A8282E}
</style></head><body>
<img class="m tl" src="assets/motif-tl.png"><img class="m tr" src="assets/motif-tl.png">
<img class="m bl" src="assets/motif-bl.png"><img class="m br" src="assets/motif-bl.png">
<div class="c">
  <img class="orn" src="assets/motif-ust.png"><img class="nm" src="assets/isimler.png">
  <p class="date">Kına 27 Kasım · Düğün 29 Kasım 2026</p>
  <p class="inv">Düğünümüze davetlisiniz.</p>
</div>
</body></html>
